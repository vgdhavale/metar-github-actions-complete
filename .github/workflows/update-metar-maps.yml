name: Update METAR maps

on:
  schedule:
    - cron: "7 */2 * * *" # Runs every 2 hours at the start of the hour
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write    # Changed from read to write so python can create directories/files safely
  pages: write
  id-token: write

concurrency:
  group: metar-maps
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin libgdal-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Validate syntax
        run: python -m py_compile src/metar_maps.py

      - name: Run METAR script
        env:
          MPLBACKEND: Agg
        run: |
          mkdir -p output
          python src/metar_maps.py

      - name: Build Pages site
        run: |
          mkdir -p public
          # Copy EVERYTHING (including the CSV file) from output to public
          if [ -d "output" ] && [ "$(ls -A output)" ]; then
            cp -r output/* public/
          else
            echo "Warning: No files found in output/ directory!"
          fi
          
          # Generate index.html dashboard with a link to download the CSV data
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Indian METAR maps</title>
            <style>
              body{font-family:Arial,sans-serif;max-width:1400px;margin:2rem auto;padding:0 1rem;background:#f5f5f5}
              .map{background:white;margin:1rem 0;padding:1rem;box-shadow:0 1px 5px #bbb;border-radius:4px}
              img{max-width:100%;height:auto;display:block;margin-top:10px}
              .download-btn{display:inline-block;background:#007bff;color:white;padding:10px 15px;text-decoration:none;border-radius:4px;font-weight:bold;margin-bottom:20px}
              .download-btn:hover{background:#0056b3}
            </style>
          </head>
          <body>
            <h1>Indian METAR maps</h1>
            <p>Updated every 2 hours automatically.</p>
            <a href="metar_dataframe.csv" class="download-btn" download>📥 Download CSV Data File</a>
            <div id="maps-container"></div>
            <script>
              const maps=[
                ['Station observations','metar_station_observations.png'],
                ['Pressure','metar_pressure_contours.png'],
                ['Temperature','metar_temperature_contours.png'],
                ['Dew point','metar_dewpoint_contours.png'],
                ['Wind','metar_wind_speed_barbs.png'],
                ['Visibility','metar_visibility.png'],
                ['Current weather','metar_current_weather.png']
              ];
              document.getElementById('maps-container').innerHTML = maps.map(x=>`
                <section class="map">
                  <h2>${x[0]}</h2>
                  <img src="${x[1]}" alt="${x[0]}">
                </section>
              `).join('');
            </script>
          </body>
          </html>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
